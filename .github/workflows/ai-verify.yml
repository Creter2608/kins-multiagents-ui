name: AI-Ready Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Autonomous Engine & Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build and Run Engine Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Diagnostic On Failure
        if: failure()
        run: |
          echo "### ❌ Test Failures Diagnostic" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -B 3 -A 25 "not ok" test.log >> $GITHUB_STEP_SUMMARY || tail -n 50 test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          while IFS= read -r line; do
            echo "::error title=Test Failure::$line"
          done < <(grep "not ok" test.log || true)

      - name: Verify Golden Assertions SHA-256 Tamper Gate
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { validateWorkspace, parseSha256Hex } from './dist/src/index.js';
            const expectedSha = fs.readFileSync('.eval/golden_assertions.sha256', 'utf-8').trim().split(/\s+/)[0];
            const results = await validateWorkspace({
              goldenPath: '.eval/golden_assertions.json',
              expectedSha256: expectedSha
            });
            console.log('Successfully verified', results.length, 'golden assertions.');
          "

      - name: Verify Docker Container Build & Execution
        run: |
          docker build -t test-ai-sandbox .
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace test-ai-sandbox npm test
